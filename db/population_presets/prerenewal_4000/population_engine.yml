      HighNovice: novice_set
    NameProfile: default
    ChatProfile: default
    Hair: [0, 42]
    HairColor: [0, 131]
    ClothesColor: [0, 699]
    BaseLevel: [1, 9]
    JobLevel: [1, 9]
    Str: [1, 9]
    Agi: [1, 9]
    Vit: [1, 9]
    Int: [1, 9]
    Dex: [1, 9]
    Luk: [1, 9]
