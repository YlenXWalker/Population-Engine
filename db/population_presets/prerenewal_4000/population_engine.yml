    HairColor: [0, 131]
    ClothesColor: [0, 699]
    BaseLevel: [70, 99]
    JobLevel: [30, 70]
    Str: [35, 80]
    Agi: [35, 80]
    Vit: [35, 70]
    Int: [35, 80]
    Dex: [60, 90]
    Luk: [20, 50]
    Flags: [mortal, boss_avoid]
