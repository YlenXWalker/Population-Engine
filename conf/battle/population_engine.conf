//--------------------------------------------------------------
// rAthena Population Engine Configuration File
//--------------------------------------------------------------
// Note 1: Value is a config switch (on/off, yes/no or 1/0)
// Note 2: Value is in milliseconds
// Note 3: Value is in cells
// Note 4: Value is a bit field
//--------------------------------------------------------------
// Population shells are server-side characters that fill maps; see
// doc/population_engine.txt. @reloadbattleconf re-reads this file, but the
// combat, wander and chat timers are created when the map-server starts:
// changing their intervals, or turning wander or chat on when it was off
// at start, needs a restart.
//--------------------------------------------------------------

//--------------------------------------------------------------
// Limits and spawning
//--------------------------------------------------------------

// Most shells that may exist at once. Autosummon and @populate stop at
// this number.
// Default: 1000
population_engine_max_count: 5000

// Most shells the autosummon timer spawns in one run. The timer runs every
// 10 seconds. 0: no limit.
// Default: 50
population_engine_autosummon_batch_size: 100

// Strict loading of the population job databases (Note 1)
// no:  invalid items and values are dropped with a warning; the rest loads.
// yes: a job database file with any validation error loses all its entries.
// Default: off
population_engine_equipment_strict_load: off

// Shell name fallback (Note 1)
// Used by the bot_index name strategy and when generated names are rejected.
// no:  a syllable name from a built-in table.
// yes: Bot_<index>.
// Default: off
population_engine_name_bot_fallback: off

// Hat effect ID shown on a shell while its combat session runs.
// Only IDs between HAT_EF_MIN and HAT_EF_MAX are sent. 0: none.
// Default: 0
population_engine_hat_effect: 0

//--------------------------------------------------------------
// Combat AI
//--------------------------------------------------------------

// AI behaviour flags (Note 4)
// 0x002 - Target switch: change to a monster that is more than 3 cells
//         closer than the current target (1 cell for attacker roles).
// 0x010 - Flee: below 30% HP, shells other than tanks cast their self-buffs
//         and step 5 cells away from the target; below 15% they drop it.
// 0x040 - Pack: a shell that takes a new target passes it to nearby idle
//         combat and guard shells.
// 0x080 - Kite: shells whose longest attack skill reaches 4 cells or more
//         stop approaching once the target is in that range.
// 0x100 - Combo: a skill whose enemy status condition is met right now is
//         tried before the rotation.
// 0x200 - Boss avoidance: shells other than tanks drop MVP targets.
// 0x001, 0x004, 0x008 and 0x020 are accepted but have no effect.
// Default: 0x1FF
population_engine_ai: 0x3D2

// Interval of the combat timer (Note 2)
// Each run processes the combat shells that are near a real player.
// Default: 100
population_engine_shell_timer_ms: 100

// Use offensive and ally-targeted skills? (Note 1)
// no: shells only use basic attacks.
// Default: on
population_engine_shell_attackskill: on

// Chance (0-100) per combat tick to basic-attack instead of choosing a
// skill. Not used for shells with the skill_only flag.
// Default: 30
population_engine_shell_basic_attack_chance: 70

// Wait between two self-buff passes, and the skill delay after a cast made
// in reaction to damage or while fleeing. (Note 2)
// Default: 200
population_engine_shell_skill_interval_ms: 100

// Shortest wait after an offensive skill. The next skill waits for the cast
// time plus the skill's own delay, or plus this value when the skill's
// delay is shorter. 0: the skill's own delay. (Note 2)
// Default: 100
population_engine_shell_attack_skill_delay_ms: 100

// A skill is not chosen when its SP cost would leave less than this
// percentage of max SP (0-99). 0: no reserve.
// Default: 15
population_engine_shell_skill_min_sp_pct: 15

// After taking a target, a shell looking for a new one takes the previous
// target again for this long while it is still valid. 0: off. (Note 2)
// Default: 2000
population_engine_shell_sticky_target_ms: 2000

// Skip skills against a target behind a wall? (Note 1)
// Default: on
population_engine_shell_skill_los_check: on

// Choose a skill only when status_check_skilluse allows it (silence, sleep,
// sitting and similar)? (Note 1)
// Default: on
population_engine_shell_skill_strict_gate: on

// Length of a roam step while a combat shell searches for monsters, capped
// by max_walk_path. 0 uses 7 and 20. (Note 3)
// Default: 7 and 20
population_engine_shell_move_min: 7
population_engine_shell_move_max: 20

// Cells tried for a forward roam step (1-256) before shorter steps are tried.
// Default: 16
population_engine_path_attempts: 16

// Interval between two monster tracker scans of a shell. (Note 2)
// The tracker feeds target switching, skill conditions and the roam
// direction.
// Default: 200
population_engine_shell_mobtracker_interval_ms: 500

// Monster detection radius. (Note 3)
// Default: 30
population_engine_shell_mdetection_cells: 30

// The result of a target search is reused for this long while the shell
// has not moved. (Note 2)
// Default: 300
population_engine_shell_detection_cache_ms: 500

// One movement order per shell per tick? (Note 1)
// yes: a combat move replaces a roam move.
// no:  every movement request is carried out.
// Default: on
population_engine_shell_movement_owner_sm: on

//--------------------------------------------------------------
// Wander
//--------------------------------------------------------------

// Random walk of shells that are not fighting. (Note 1)
// Default: on
population_engine_wander_enable: on

// Interval of the wander timer. (Note 2)
// Default: 500
population_engine_wander_tick_ms: 500

// Most shells that start a walk step per wander run.
// Default: 50
population_engine_wander_max_per_tick: 50

// Longest wander step, also capped at max_walk_path - 5. (Note 3)
// Default: 12
population_engine_wander_radius: 12

// Wait between two wander steps of a shell, plus a random 0 to jitter.
// (Note 2)
// Default: 2000 and 1500
population_engine_wander_cooldown_ms: 1000
population_engine_wander_cooldown_jitter_ms: 1000

//--------------------------------------------------------------
// Chat
//--------------------------------------------------------------

// Ambient lines, replies and kill lines of db/population_chat.yml. (Note 1)
// Default: off
population_engine_chat_enable: on

// Interval of the chat timer. (Note 2)
// Default: 1500
population_engine_chat_tick_ms: 1500

// Most shells that say a line per chat run.
// Default: 10
population_engine_chat_max_per_tick: 10

// Wait between two lines of one shell, plus a random 0 to jitter. (Note 2)
// Default: 15000 and 5000
population_engine_chat_cooldown_ms: 15000
population_engine_chat_cooldown_jitter_ms: 5000

// Reply to whispers and to map chat that contains a shell's name. (Note 1)
// Default: on
population_engine_chat_reply_enable: on

//--------------------------------------------------------------
// Behaviour
//--------------------------------------------------------------

// Daily cycle of town shells (Note 1)
// Town shells use their configured behaviour from 06:00 to 17:59 (server
// time), social from 18:00 to 21:59 and sit from 22:00 to 05:59.
// Default: off
population_engine_daily_cycle: off

// Vendor shells open a real vending shop that players can buy from. (Note 1)
// Default: off
population_engine_vending_enable: on
